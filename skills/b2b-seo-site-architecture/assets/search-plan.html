<script>
'use strict';
/* __VERSION_PANEL__ */
/* __PAGE_CONFIRMATION__ */
const data = JSON.parse(document.getElementById('search-data').textContent);
function unpack(fields, rows) {
  return rows.map(cells => { const item={}; fields.forEach((field,i)=>{item[field]=cells[i];}); return item; });
}
data.decisions=unpack(data.word_fields,data.word_rows);
data.ranks=unpack(data.rank_fields,data.rank_rows);
delete data.word_rows;
delete data.rank_rows;
const byId = id => document.getElementById(id);
const wordById = new Map(data.decisions.map(row => [row.keyword_id, row]));
const pageById = new Map(data.pages.map(row => [row.id, row]));
data.overview = data.pages.filter(page => page.page_type !== 'article');
const wordsByPage = new Map();
for (const word of data.decisions) {
  if (!word.page_id) continue;
  if (!wordsByPage.has(word.page_id)) wordsByPage.set(word.page_id, []);
  wordsByPage.get(word.page_id).push(word);
}
const prices = new Map(data.prices.map(row => [row.source_ref, row]));
const ranks = new Map(data.ranks.map(row => [row.source_ref, row]));
const valueById = new Map(data.values.filter(row => row.value_id).map(row => [row.value_id, row]));
const labels = {full:'拟完整承接',partial:'拟部分承接',pending:'待核',out_of_scope:'范围外',unreviewed:'待补审阅',
  primary:'主词',support:'辅助词',page:'页面',section:'同页章节',filter:'筛选项',defer:'待核',exclude:'排除',
  new:'新建',reuse:'复用',revise:'改造',proposed:'拟议',confirmed:'已确认',candidate:'生成候选',source:'原表',plan_only:'计划内资料'};
const title = key => labels[key] || key || '待补';
const primaryName = row => /^en(?:[-_]|$)/i.test(data.project.language) && row.name_en ? row.name_en : row.name;
const pageName = row => row ? [...new Set([primaryName(row),row.name_zh].filter(Boolean))].join(' · ') : '';
/* __OPPORTUNITIES__ */
const modes = {opportunities:'业务待核与取舍',overview:'网站页面规划表',pages:'架构树与单页简报',groups:'商业页面拆并',coverage:'意图覆盖',decisions:'整理后词库',terms:'词频与词组',
  intents:'整句与采购意图',values:'属性与取值',inputs:'原始数据表',sites:'竞品站点',urls:'竞品流量与排名页',prices:'商品报价'};
const sections = {'页面规划':['overview','pages','groups','coverage'],'词库分析':['decisions','terms','intents','values'],
  '输入与竞品':['opportunities','inputs','sites','urls','prices']};
const captions = {opportunities:'查看拆并理由、企业需要补齐的资料和竞品原始记录。',overview:'逐页选择要建或不建，暂时拿不准的留为待定。复制工作台链接给 Codex，即可按已选页面建站或更新内容。',pages:'按父子层级查看每页的采购任务、关键词和内容模块。',groups:'比较同一取值的不同采购任务，以及每组词的拆并依据。',
  coverage:'按来源、市场和语言核对完整承接、部分承接及尚待处理的需求。',decisions:'每行是同一市场、语言中的一个查询。点击原词可看分词、原始记录及页面归属。',
  terms:'单词和连续两至三词按不同查询数排序。点击词组可展开全部原句。',intents:'从完整查询判断买家要完成的事，再查看同组的全部表达。',
  values:'维度用成员并集计数。选择一个取值可查看全部成员。',inputs:'查看收到的文件、原始行与下载入口。',
  sites:'打开客户提供的竞品站点，查看实访记录与该站收到的排名页。',urls:'按工具、日期及具体 URL 查看整页估算流量和收到的逐词排名。',
  prices:'逐条核对商品标价、币种、数量、配置与交付条件。'};
let selectedIntent='', selectedTerm=null, selectedSite='', selectedUrl='', sourceId='', sourceRow=1, activePage='', locale='';
const groupById=new Map(data.intents.map(row=>[row.id,row]));
const inputById=new Map(data.inputs.map(row=>[row.id,row]));
const srcByKey=new Map(data.inputs.map(row=>[row.family+'|'+row.source_id,row]));
data.terms=data.terms.map(([market,language,term,ngram,tf,df,denominator])=>({market,language,term,ngram,tf,df,denominator}));

const scopeModes = new Set(['decisions','groups']);
let mode = 'pages', selectedPage = '', selectedValue = '', selectedPlan = '', selectedDimension = null, selectedWord = '', offset = 0;
const size = 30;
function node(tag, value, cls) {
  const item = document.createElement(tag);
  if (value !== undefined && value !== null) item.textContent = String(value);
  if (cls) item.className = cls;
  return item;
}
function line(parent, label, value) {
  const block = node('div', '', 'field');
  block.append(node('strong',label),node('span',Array.isArray(value) ? value.join('\n') || '—' : value === '' || value == null ? '—' : value));
  parent.append(block);
}
function action(label, handler) {
  const b = node('button',label); b.type = 'button'; b.addEventListener('click',handler); return b;
}
function reset(view) {
  byId('decision-filter').value='';
  opportunityFilter='all';opportunityId='';
  mode = view; selectedIntent='';selectedTerm=null;selectedSite='';sourceId='';sourceRow=1;activePage='';locale='';byId('locale').value=''; selectedPage = ''; selectedValue = ''; selectedPlan = ''; selectedDimension = null; selectedWord = ''; offset = 0;
  selectedUrl='';byId('query').value = ''; byId('page').value = ''; byId('priority').value = '';
}
function openWords({page='', value='', plan='', dimension=null, word='',intent='',term=null}={}) {
  reset('decisions'); selectedPage = page; selectedValue = value; selectedPlan = plan; selectedDimension = dimension; selectedWord = word; selectedIntent=intent;selectedTerm=term;
  byId('page').value = page; navigate();
}
function details(label, parent) {
  const d = node('details'); d.append(node('summary',label)); parent.append(d); return d;
}
function metric(parent, row) {
  line(parent,'已知月搜索量 / 有量查询', (row.known_monthly_volume === '' ? '未提供' : row.known_monthly_volume) + ' · ' + row.volume_coverage);
  line(parent,'KD 覆盖',row.kd_coverage);
  if (row.kd_unknown !== undefined) line(parent,'KD 词数（低于 30 / 30 至低于 60 / 60–100 / 未知）',
    [row.kd_under_30,row.kd_30_to_under_60,row.kd_60_to_100,row.kd_unknown].join(' / '));
}
function priceCard(box,row) {
  external(box,row.url); line(box,'原始记录',[row.provider,row.observed_at,row.evidence_class]);sourceRef(box,'rankings',row.source_ref);
  line(box,'原始报价',[row.price,row.price_type,row.currency,row.unit].filter(Boolean));
  line(box,'可比条件',[['配置',row.configuration],['起订量',row.minimum_quantity],['交付地',row.destination],
    ['贸易条件',row.delivery_basis],['税运',row.tax_freight],['有效期',row.valid_until]].map(([k,v])=>k+' · '+(v||'未知')));
}
function renderPage(box,p) {
  box.append(node('h2',pageName(p)),node('p',[p.id,title(p.page_type),p.url].join(' · '),'meta'));
  const choice=node('div','','field');choice.append(node('strong','本次是否建页'),pageChoices.controls(p.id));box.append(choice);
  if(p.primary_keyword)box.append(chip('主词 · '+p.primary_keyword));
  line(box,'页面职责',p.objective); line(box,'页面安排',[title(p.page_action),title(p.approval),p.priority].filter(Boolean).join(' · '));line(box,'优先理由',p.priority_reason);
  line(box,'拆并依据',p.rationale); line(box,'相邻页边界',[p.boundary,...p.adjacent_page_ids.map(id=>id+' '+pageName(pageById.get(id)))].filter(Boolean));
  if(p.query_count)metric(box,p); line(box,'企业事实与待补资料',p.fact_gaps);
  if(p.query_count)box.append(action('查看本页全部 '+p.query_count+' 个词',()=>openWords({page:p.id})));
  const modules = data.modules.filter(m=>m.page_id===p.id);
  for (const m of modules) {
    const d = details(m.order+' · '+m.name+'（'+m.keyword_ids.length+' 词）',box);
    line(d,'买家问题',m.buyer_question); line(d,'本页要回答的内容',m.content); line(d,'所需事实',m.required_facts);
    for (const id of m.keyword_ids.slice(0,20)) d.append(action(wordById.get(id).keyword,()=>openWords({word:id})));
    if(m.keyword_ids.length>20)d.append(node('p','此处列前 20 词。全部成员见本页关键词或内容模块 CSV。','muted'));
  }
  for(const c of data.comparisons.filter(c=>c.page_id===p.id)) {
    const d=details('同类竞品 · '+c.url,box); external(d,c.url);line(d,'可比理由',c.reason); line(d,'页面观察',[c.page_type,c.status,c.observed_at]);
    d.append(action('查看此网址的排名词与 Top Pages',()=>{
      reset('urls');selectedUrl=c.url;locale=JSON.stringify([data.project.market,data.project.language]);
      byId('locale').value=locale;navigate();

function parentsTree(all, chosen, panel) {
  const tree=node('div','','surface tree');tree.append(node('h2','页面层级'));
  const allowed=new Set(all.map(r=>r.id)),byParent=new Map();
  for(const p of all){const k=allowed.has(p.parent_id)?p.parent_id:'';if(!byParent.has(k))byParent.set(k,[]);byParent.get(k).push(p);}
  function branch(parentId) {
    const ul=node('ul');
    for(const p of byParent.get(parentId)){
      const li=node('li'),row=node('div','','branch-row');
      const b=action(primaryName(p),()=>openPage(p.id));
      if(p.name_zh && p.name_zh!==primaryName(p))b.append(node('small',p.name_zh));
      if(p.id===chosen)b.setAttribute('aria-current','page');
      li.append(row);
      if(byParent.has(p.id)){
        const children=branch(p.id);
        const toggle=action('',()=>{
          if(children.hidden)collapsedBranches.delete(p.id);else collapsedBranches.add(p.id);
          sync();
        });
        toggle.className='branch-toggle';

    }
    return ul;
  }

function downloadPageWords(page) {
  const fields=[
    'page_id','target_url','market','language','keyword_id','keyword','role','group_id','buyer_task',
    'module_id','disposition','coverage','reason','remaining_need','dimension_value_ids','planning_ids',
    'monthly_volume','monthly_volume_state','monthly_volume_basis','volume_group','monthly_volume_refs',
    'kd','kd_state','kd_basis','kd_refs','source_classes','source_refs','ranked_urls','ranking_refs'
  ];
  const quoteCell=value=>{
    let cell=value??'';
    if(Array.isArray(cell))cell=cell.join('\n');
    else if(typeof cell==='object')cell=JSON.stringify(cell);
    return '"'+String(cell).replaceAll('"','""')+'"';
  };
  const rows=[fields];
  for(const word of wordsByPage.get(page.id)){
    const record={...word,
      monthly_volume_basis:data.metric_bases[word.volume_basis_id],
      kd_basis:data.metric_bases[word.kd_basis_id],
      ranked_urls:[...new Set(word.ranking_refs.map(ref=>ranks.get(ref)?.url).filter(Boolean))]
    };
    rows.push(fields.map(key=>record[key]));
  }
  const csv='\uFEFF'+rows.map(row=>row.map(quoteCell).join(',')).join('\r\n')+'\r\n';
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),link=node('a');
  link.href=url;link.download='page-'+page.id.replace(/[^\p{L}\p{N}._-]/gu,'_')+'-keywords.csv';
  document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}

  if(mode==='sites'){
    for(const site of items){const boxSite=node('article');boxSite.append(node('h2',site.name));external(boxSite,site.start_url||'https://'+site.domain+'/',site.domain);
      line(boxSite,'业务角色与研究范围',[site.role,site.coverage]);line(boxSite,'选择依据',site.selection_reason||site.summary);
      const list=data.reviews.filter(r=>r.competitor_id===site.id);
      const reviewed=details('页面研究记录 · '+list.length,boxSite);
      for(const r of list){external(reviewed,r.url);line(reviewed,'观察',[r.page_type,title(r.status),r.observed_at,r.summary].filter(Boolean));}
      boxSite.append(action('查看该站流量与排名页',()=>{reset('urls');selectedSite=site.id;navigate();}));box.append(boxSite);
    }return;
  }
  for(const row of items){const card=node('article');renders[mode](card,row);box.append(card);}
}
function hasPhrase(tokens,phrase) {
  const parts=phrase.split(' ');
  return tokens.some((token,i)=>token===parts[0]&&parts.every((part,j)=>tokens[i+j]===part));
}
function draw() {
  for(const b of byId('nav').querySelectorAll('button')){
    const selected=b.dataset.mode===mode;b.setAttribute('aria-pressed',String(selected));
    if(selected)b.parentElement.open=true;
  }
  byId('selection-summary').hidden=!['overview','pages'].includes(mode);pageChoices.summary();
  byId('decision-field').hidden=mode!=='overview';
  byId('view-title').textContent=modes[mode];byId('view-desc').textContent=captions[mode];
  byId('page-field').hidden=!scopeModes.has(mode);byId('term-field').hidden=mode!=='terms';
  byId('locale-field').hidden=!['terms','intents','values','coverage','decisions','groups','prices','urls'].includes(mode);
  byId('metrics').hidden=mode!=='pages'&&mode!=='overview';byId('pager').hidden=false;
  byId('priority-field').hidden=mode!=='overview'||byId('priority').options.length<=2;
  byId('query').placeholder=mode==='overview'?'输入页面名称、网址或分到本页的词':'搜索当前视图';
  const q=byId('query').value.trim().toLowerCase(),box=byId('results'),focus=byId('focus');box.replaceChildren();focus.replaceChildren();
  if(mode==='opportunities')opportunityTabs(focus);
  if(mode==='inputs'&&inputById.has(sourceId)){
    focus.append(action('返回全部原始资料',()=>{reset('inputs');navigate();}));
    const panel=node('article');box.append(panel);rawView(panel,inputById.get(sourceId));byId('pager').hidden=true;return;
  }
  const length=Number(byId('term-length').value);
  const filtered=data[mode].filter(r=>{
    if(mode==='opportunities'){
      if(opportunityFilter!=='all'&&opportunityState(r)!==opportunityFilter)return false;
      return !q||[r.title,r.question,r.reason,...r.urls,...r.keyword_ids.map(k=>wordById.get(k)?.keyword)].join(' ').toLowerCase().includes(q);
    }
    if(mode==='overview'){
      if(byId('decision-filter').value && pageChoices.decision(r.id)!==byId('decision-filter').value)return false;
      if(byId('priority').value && r.priority!==byId('priority').value)return false;
      return !q || [pageName(r),r.url,r.primary_keyword,r.id].join(' ').toLowerCase().includes(q)
        || (wordsByPage.get(r.id)||[]).some(w=>w.keyword.toLowerCase().includes(q));
    }
    if(mode==='decisions' && selectedWord && r.keyword_id!==selectedWord)return false;
    if(selectedPage && mode!=='pages' && r.page_id!==selectedPage)return false;
    if(selectedValue && !r.dimension_value_ids.includes(selectedValue))return false;
    if(selectedPlan && !r.planning_ids.includes(selectedPlan))return false;
    if(selectedDimension && (!r.dimension_value_ids.some(id=>valueById.get(id).dimension===selectedDimension.dimension)
        ||r.market!==selectedDimension.market||r.language!==selectedDimension.language))return false;
    if(selectedIntent && r.group_id!==selectedIntent)return false;
    if(selectedTerm && (r.market!==selectedTerm.market||r.language!==selectedTerm.language||!hasPhrase(data.tokens[r.keyword_id]||[],selectedTerm.term)))return false;
    if(selectedSite && r.competitor_id!==selectedSite)return false;
    if(selectedUrl && r.url!==selectedUrl)return false;
    if(mode==='terms' && length && r.ngram!==length)return false;
    if(locale&&!byId('locale-field').hidden && JSON.stringify([r.market,r.language])!==locale)return false;
    return !q || (mode==='decisions'? [r.keyword,r.keyword_id,r.buyer_task,r.target_url,r.module_id].join(' '):
      mode==='terms'?r.term:mode==='inputs'?[r.name,r.label,r.kind,r.provider].join(' '):JSON.stringify(r)).toLowerCase().includes(q);
  });
  if(selectedWord||selectedValue||selectedPlan||selectedDimension||selectedIntent||selectedTerm||selectedSite||selectedUrl){
    const tag=selectedTerm?.term||selectedDimension?.dimension||valueById.get(selectedValue)?.value||
      groupById.get(selectedIntent)?.buyer_task||wordById.get(selectedWord)?.keyword||selectedSite||selectedUrl||'选定拆并组';
    focus.append(chip(tag),action('清除选定范围',()=>{reset(mode);navigate();}));
  }
  if(mode==='opportunities' && opportunityId){
    const index=filtered.findIndex(r=>r.id===opportunityId);
    if(index>=0 && (index<offset||index>=offset+size))offset=Math.floor(index/size)*size;
  }
  if(mode==='pages'&&filtered.length){
    const core=filtered.filter(p=>p.page_type!=='article');
    const p=filtered.find(p=>p.id===activePage)||core[0]||filtered[0],pair=node('div','','pair');
    if(core.length)parentsTree(core,p.id,pair);else pair.style.gridTemplateColumns='1fr';
    const brief=node('article');renderPage(brief,p);pair.append(brief);box.append(pair);byId('pager').hidden=true;return;
  }
  if(!filtered.length)box.append(node('p',q?'当前范围没有匹配记录。':requireData(mode),'callout'));
  else tableView(box,filtered.slice(offset,offset+size));
  if(mode==='inputs' && !q && data.source_notes.length){
    const notes=details('计划引用的其他资料与研究依据 · '+data.source_notes.length,box);
    for(const s of data.source_notes){line(notes,s.label,[title(s.kind),s.scope,s.reference]);}
  }
  byId('count').textContent=filtered.length ? (offset+1)+'–'+Math.min(offset+size,filtered.length)+' / '+filtered.length : '0 项';
  if(filtered.length<=size)byId('pager').hidden=true;
  byId('prev').disabled=offset===0;byId('next').disabled=offset+size>=filtered.length;
}
Object.assign(labels,{keywords:'词库原表',rankings:'逐词排名',pages:'流量页面',prices:'商品报价',material:'客户资料',
  home:'首页',category_overview:'分类总览',category:'选型目录',product:'产品详情',attachment:'附件详情',
  application_hub:'应用目录',application:'应用方案',capability:'能力与交付',company:'企业介绍',resource:'资料目录',
  utility:'采购支持',inquiry:'询价页',blog:'博客入口',blog_category:'博客分类',article:'文章选题',
  missing:'未提供',select_basis:'待选指标口径',conflicting:'数值冲突',conflicting_pool:'共享估值有冲突',invalid:'数值无效',
  competitors:'竞品名单',catalogue:'产品资料',simulation:'模拟数据',provider_export:'工具导出',user_provided:'用户资料',
  model_inference:'推断候选',historical_sample:'历史资料',browser_observation:'实访',partial:'拟部分承接',
  observed:'已实访',simulated:'模拟观察',blocked:'访问受阻',not_started:'尚未实访'});
byId('project').textContent=data.project.name;
byId('status').textContent=(data.project.mode==='simulation'?'模拟项目 · ':'')+'目标 '+data.project.market+' / '+data.project.language;
for(const [label,num] of [['核心页',data.pages.filter(p=>p.page_type!=='article').length],['全库查询',data.summary.keywords],
  ['采购任务组',data.intents.length],['接收文件记录',data.inputs.length]]){
  const m=node('span');m.append(node('b',num),label);byId('metrics').append(m);
}
for(const [section,views] of Object.entries(sections)){
  const group=node('details','','navgroup');group.open=views.includes('overview');group.append(node('summary',section));
  for(const view of views){const b=action(modes[view],()=>{reset(view);navigate();});b.dataset.mode=view;group.append(b);}
  byId('nav').append(group);
}
const locales=new Map();
for(const collection of [data.decisions,data.urls,data.prices]){
  for(const r of collection)locales.set(JSON.stringify([r.market,r.language]),r.market+' / '+(r.language||'未知'));
}
byId('locale').append(new Option('全部市场与语言',''));for(const [key,label] of locales)byId('locale').append(new Option(label,key));
byId('page').append(new Option('全部页面',''));for(const p of data.pages)byId('page').append(new Option(pageName(p),p.id));
byId('page').addEventListener('change',e=>{selectedPage=e.target.value;offset=0;navigate(true);});
byId('locale').addEventListener('change',e=>{locale=e.target.value;offset=0;navigate(true);});
byId('term-length').addEventListener('change',()=>{offset=0;draw()});
for(const priority of new Set(data.overview.map(p=>p.priority).filter(Boolean)))byId('priority').append(new Option(priority,priority));
byId('decision-filter').addEventListener('change',()=>{offset=0;navigate(true);});
byId('priority').addEventListener('change',()=>{offset=0;navigate(true);});
byId('query').addEventListener('input',()=>{offset=0;if(mode==='overview'||mode==='opportunities')navigate(true);else draw();});
byId('prev').addEventListener('click',()=>{opportunityId='';offset=Math.max(0,offset-size);draw()});
byId('next').addEventListener('click',()=>{opportunityId='';offset+=size;draw()});
function setMenu(open){
  byId('rail').classList.toggle('open',open);byId('menu').setAttribute('aria-expanded',String(open));
  byId('nav-shade').hidden=!open;document.querySelector('.desk').inert=open;
  if(open)byId('close-menu').focus();
}
function closeMenu(){setMenu(false);byId('menu').focus();}
byId('menu').addEventListener('click',()=>setMenu(true));
byId('close-menu').addEventListener('click',closeMenu);
byId('nav-shade').addEventListener('click',closeMenu);
matchMedia('(max-width:740px)').addEventListener('change',event=>{if(!event.matches)setMenu(false);});
document.addEventListener('keydown',e=>{
  if(!byId('rail').classList.contains('open'))return;
  if(e.key==='Escape'){closeMenu();return;}
  if(e.key==='Tab'){
    const controls=[...byId('rail').querySelectorAll('button, summary, a')].filter(el=>el.getClientRects().length);
    if(e.shiftKey&&document.activeElement===controls[0]){e.preventDefault();controls.at(-1).focus();}
    else if(!e.shiftKey&&document.activeElement===controls.at(-1)){e.preventDefault();controls[0].focus();}
  }
});
for(const [name,label] of Object.entries({'clean-keywords':'整理后原词库','words-and-phrases':'全量词频与词组','intent-groups':'整句意图组',
  'pages':'页面规划','page-opportunities':'业务待核与拆并取舍','keyword-decisions':'逐词归属','commercial-planning':'商业页面拆并','demand-coverage':'覆盖统计','dimension-values':'属性与取值',
  'content-modules':'内容模块','received-rankings':'收到的排名','comparable-pages':'同类竞品依据','price-observations':'商品价格','input-files':'来源目录'})){
  const a=node('a',label);a.href=name+'.csv';a.download='';byId('files').append(a);
}
document.addEventListener('workbench-choice-update',()=>{if(mode==='overview'||mode==='pages')draw();});
document.addEventListener('architecture-version-ready',()=>{if(mode==='pages')draw();});
window.addEventListener('popstate',restore);restore();
