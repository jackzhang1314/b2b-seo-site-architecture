interface:
  display_name: "B2B 网站页面架构规划"
  short_description: "从大词库、竞品页面和报价规划商业页面、逐词归属及内容模块"
  default_prompt: "使用 $b2b-seo-site-architecture，接收企业与产品资料、行业词库、竞品Top Pages、商品报价及排名关键词与URL表；先用脚本统计词频、属性线索与页面证据，再结合语义和Computer Use研究，交付可搜索的详细HTML和全量CSV，说明每页的主辅词、采购问题、模块和拆并理由，同时交付英文为主、中文辅助的网站架构、应用集合层级、类目筛选、产品详情字段及完整设计简报；按约定确定博客范围，缺资料时指导补数，先规划再按授权设计建站。"
